function openLesson(n) { if (n !== CUR) { W.i = 0; W.step = 1; W.pick = {}; } CUR = n; S.last = n; if (S.max[n] === undefined) S.max[n] = 0; persist(); go('lesson'); }
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }
function render() {
  $('#top').innerHTML = header();
  const views = { home: vHome, lesson: vLesson, ref: vRef };
  $('#view').innerHTML = `<div class="view">${views[R]()}</div>`;
  const focus = R === 'lesson';
  $('#nav').hidden = focus; $('#app').classList.toggle('focus', focus);
  $('#nav').innerHTML = [['home', 'Уроки', I.course], ['ref', 'Справочник', I.ref]].map(([id, n, i]) => `<button class="${R === id ? 'on' : ''}" data-go="${id}" ${R === id ? 'aria-current="page"' : ''}>${i}${n}</button>`).join('');
  if (focus) wkRender();
  document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px');
}
function header() {
  const set = `<button class="icon-btn push" data-act="settings" aria-label="Настройки">${I.sliders}</button>`;
  if (R === 'lesson') { const L = lessonBy(CUR); return `<button class="icon-btn" data-go="home" aria-label="Назад к урокам" style="margin-left:-10px">${I.back}</button><div class="hd-t"><b>Урок ${L.n}</b><small>${L.short}</small></div>${set}`; }
  return `<div class="brand">${STAR.replace('<svg', '<svg class="star"')}Мизан</div>${set}`;
}

/* ============ HOME ============ */
const progressOf = n => S.done[n] ? NS : S.max[n] !== undefined ? S.max[n] + 1 : 0;
const pips = k => `<span class="pips" aria-label="${k} из ${NS}">${STEPS.map((_, i) => `<i class="${i < k ? 'on' : ''}"></i>`).join('')}</span>`;
function vHome() {
  const nextN = (LESSONS.find(L => !S.done[L.n]) || LESSONS[LESSONS.length - 1]).n;
  const heroN = S.max[S.last] !== undefined && !S.done[S.last] ? S.last : nextN;
  const L = lessonBy(heroN), started = S.max[heroN] !== undefined, done = !!S.done[heroN];
  const doneCount = LESSONS.filter(x => S.done[x.n]).length;
  return `
  <section class="mast">
    <div class="ar" lang="ar">التَّصْرِيفُ</div>
    <p>Сарф по учебнику на основе «العزي». Текст автора, объяснения, вопросы и задания каждого урока.</p>
  </section>
  <button class="resume" data-lesson="${L.n}">
    <span class="medal">${MEDAL}<b>${toAr(L.n)}</b></span>
    <span class="tx"><span class="lbl">${done ? 'Пройден' : started ? 'Вы остановились здесь' : 'Следующий урок'}</span><span class="t-ar" lang="ar">${L.ar}</span><span class="t-ru">${L.ru}</span></span>
    <span class="go"><span>${started && !done ? 'Продолжить' : 'Открыть урок'}${I.arrow}</span>${pips(progressOf(heroN))}</span>
  </button>
  <div class="sec-row"><h2 class="h2">Уроки</h2><span class="note">${doneCount} из ${TOTAL} пройдено</span></div>
  <div class="thread">
    ${LESSONS.map(x => { const p = progressOf(x.n), d = !!S.done[x.n]; return `<button class="li ${d ? 'done' : ''} ${x.n === heroN ? 'cur' : ''}" data-lesson="${x.n}"><span class="node">${NODE}<b>${x.n}</b></span><span class="tx"><b>${x.short}</b>${ar(x.ar)}</span><span class="st ${d ? 'ok' : ''}">${d ? 'пройден' : p ? `${p} из ${NS}` : ''}</span></button>`; }).join('')}
    <div class="li soon"><span class="node">${NODE}<b>…</b></span><span class="tx"><b>Уроки ${LESSONS.length + 1}–${TOTAL} появятся по мере работы</b></span><span></span></div>
  </div>`;
}

/* ============ LESSON ============ */
function vLesson() {
  const L = lessonBy(CUR), s = stepOf(), mx = S.max[CUR] || 0;
  const steps = `<nav class="steps" aria-label="Шаги урока">${STEPS.map((n, i) => `<button class="stp ${i === s ? 'on' : ''} ${i <= mx && i !== s ? 'seen' : ''}" data-act="step" data-v="${i}" ${i === s ? 'aria-current="step"' : ''}><i></i>${n}</button>`).join('')}</nav>`;
  const body = [stText, stExplain, stWorked, stQuestions, stTasks][s](L);
  const nx = lessonBy(CUR + 1);
  const fwd = s < NS - 1
    ? `<button class="btn" data-act="step" data-v="${s + 1}">Дальше: ${STEPS[s + 1].toLowerCase()}</button>`
    : S.done[CUR] ? (nx ? `<button class="btn" data-lesson="${nx.n}">Урок ${nx.n}${I.arrow}</button>` : `<button class="btn" data-go="home">К урокам</button>`)
      : `<button class="btn" data-act="finish">Завершить урок</button>`;
  return steps + body + `<div class="lnav">${s > 0 ? `<button class="btn ghost" data-act="step" data-v="${s - 1}" aria-label="Назад">${I.back}</button>` : ''}${fwd}</div>`;
}
const isOpen = id => OPEN.has(id);
const disc = (id, label) => `<button class="disc" data-act="tgl" data-t="${id}" aria-expanded="${isOpen(id)}">${I.chev}${label}</button>`;
const paneAttr = id => `id="${id}" ${isOpen(id) ? '' : 'hidden'}`;
function stText(L) {
  return `
  <div class="ltitle"><div class="ar" lang="ar" dir="rtl">${L.ar}</div><p class="note">${L.ru}. Нажмите на любое слово, чтобы увидеть его перевод. Подчёркнутые слова — термины.</p></div>
  ${L.text.map((p, i) => { const id = `tr${L.n}-${i}`; return `
  <div class="card para">
    ${p.h ? `<div class="para-h" lang="ar">${p.h}</div>` : ''}
    <p class="ar src" lang="ar">${tw(p.src)}</p>
    ${disc(id, 'Перевод и словосочетания')}
    <div class="pane" ${paneAttr(id)}>
      <p>${mix(p.tr)}</p>
      ${(g => g.length ? `<div class="gl">${g.map(([w, r]) => `${ar(w)}<span>${mix(r)}</span>`).join('')}</div>` : '')(glAll(p))}
    </div>
  </div>`; }).join('')}`;
}
function stExplain(L) {
  const B = BOOK[L.n];
  const folds = B && B.tb.length ? `<div class="bookline">Таблицы учебника</div>` + B.tb.map((t, i) => {
    const id = `fb${L.n}-${i}`;
    return `<div class="fold"><button data-act="tgl" data-t="${id}" aria-expanded="${isOpen(id)}"><span class="ico">${I.table}</span>${t.h}${I.chev}</button>
      <div class="fold-b" ${paneAttr(id)}>${t.pt ? ptab(`${L.n}-${i}`, t.pt) : noteWords(t.html())}${t.note ? `<p class="note">${mix(t.note)}</p>` : ''}</div></div>`;
  }).join('') : '';
  return L.ex() + folds;
}
const stWorked = L => `<div class="ltitle"><h2 class="h2 plain">Разберём вместе</h2><p class="note">Два примера с решением, третий разбираете сами.</p></div><div class="card" id="wk"></div>`;

/* ---- paradigm grids ---- */
function grid(f, g = 'all') {
  if (g === 'noun') {
    const c = w => `<div class="cell">${ar(w)}</div>`;
    return `<div class="cols"><span><b>مُفْرَدٌ</b><bdi dir="ltr">ед. ч.</bdi></span><span><b>مُثَنًّى</b><bdi dir="ltr">дв. ч.</bdi></span><span><b>جَمْعٌ</b><bdi dir="ltr">мн. ч.</bdi></span></div>
      <div class="cg-h">${ar('مُذَكَّرٌ')}<small>м. р.</small></div><div class="cgrid">${f.slice(0, 3).map(c).join('')}</div>
      <div class="cg-h">${ar('مُؤَنَّثٌ')}<small>ж. р.</small></div><div class="cgrid">${f.slice(3).map(c).join('')}</div>`;
  }
  const groups = (g === 'amr' ? G2 : GROUPS).filter(gr => gr.rows.flat().some(k => f(k)));
  const cells = (row, last) => row.map((k, j) => { const w = f(k); return `<div class="cell ${last && j === 1 ? 'span2' : ''} ${w ? '' : 'nil'}">${ar(w || '—')}<small>${ar(PRON[k][0])} · ${PRON[k][1]}</small></div>`; }).join('');
  return `<div class="cols"><span><b>مُفْرَدٌ</b><bdi dir="ltr">ед. ч.</bdi></span><span><b>مُثَنًّى</b><bdi dir="ltr">дв. ч.</bdi></span><span><b>جَمْعٌ</b><bdi dir="ltr">мн. ч.</bdi></span></div>
  ${groups.map(gr => `<div class="cg-h">${ar(gr.h)}<small>${gr.ru}</small></div>${gr.rows.map(r => `<div class="cgrid">${cells(r, r.length === 2)}</div>`).join('')}`).join('')}`;
}
function ptab(key, spec) {
  const j = PT[key] || 0, v = spec.v[j];
  const chips = spec.v.length > 1 ? `<div class="hscroll" dir="rtl">${spec.v.map(([w], k) => `<button class="rchip sm ${k === j ? 'on' : ''}" data-act="pt" data-k="${key}" data-v="${k}" lang="ar">${w}</button>`).join('')}</div>` : '';
  return `<div class="pt">${chips}<p class="pt-meta">${mix(v[1])}</p>${grid(v[2], spec.g)}</div>`;
}

/* ---- worked examples ---- */
const W = { i: 0, step: 1, pick: {} };
function wkRender() {
  const el = $('#wk'); if (!el) return;
  const WK = lessonBy(CUR).wk, ex = WK[W.i];
  const stepHtml = ex.steps.map((s, k) => {
    const tg = `<span class="tg" lang="ar">${s.tg}</span>`;
    if (ex.self) {
      const p = W.pick[k];
      const open = k === 0 || W.pick[k - 1] !== undefined;
      if (!open) return `<div class="wk-step pending"><span class="q">${s.q}</span><span class="a">…</span><span class="tg">?</span></div>`;
      if (p === undefined) return `<div class="wk-step"><span class="q">${s.q}</span><span class="tg">?</span><div class="wk-opts">${s.o.map((o, j) => `<button class="chipb" data-act="wk-opt" data-k="${k}" data-j="${j}">${hasAr(o) && !/[а-я]/i.test(o) ? ar(o) : o}</button>`).join('')}</div></div>`;
      const ok = p === s.ans;
      return `<div class="wk-step ${ok ? 'ok' : 'bad'}"><span class="q">${ok ? 'Верно. ' : 'Не совсем. '}${s.q}</span><span class="a">${mix(s.a)}</span>${tg}</div>`;
    }
    if (k < W.step) return `<div class="wk-step"><span class="q">${s.q}</span><span class="a">${mix(s.a)}</span>${tg}</div>`;
    return `<div class="wk-step pending"><span class="q">${s.q}</span><span class="a">…</span><span class="tg">?</span></div>`;
  }).join('');
  const finished = ex.self ? Object.keys(W.pick).length === ex.steps.length : W.step >= ex.steps.length;
  el.innerHTML = `<div class="wk">
    <div class="seg">${WK.map((e, i) => `<button class="${W.i === i ? 'on' : ''}" data-act="wk-tab" data-v="${i}">${e.self ? 'Сами' : 'Пример ' + (i + 1)}</button>`).join('')}</div>
    ${ex.w ? `<div class="wk-word">${ar(ex.w)}</div><div class="wk-ru">${ex.ru}</div>` : `<div class="wk-wr">${ex.wr}</div>`}
    <div class="wk-steps">${stepHtml}</div>
    ${finished ? `<div class="wk-res" lang="ar">${ex.res}</div>` : ''}
    ${!ex.self && !finished ? `<button class="btn ghost block" data-act="wk-next">Следующий шаг</button>` : ''}
    ${finished && W.i < WK.length - 1 ? `<button class="btn ghost block" data-act="wk-tab" data-v="${W.i + 1}">${WK[W.i + 1].self ? 'Попробовать самому' : 'Следующий пример'}</button>` : ''}
  </div>`;
}

/* ---- questions ---- */
function stQuestions(L) {
  const B = BOOK[L.n];
  return `<div class="ltitle"><h2 class="h2 plain">Вопросы</h2><p class="note">Вопросы учебника (${a('أَسْئِلَةٌ')}). Сначала ответьте сами, потом откройте ответ.</p></div>
  <div class="qa">${B.q.map(([q, ru, ans], i) => { const id = `q${L.n}-${i}`; return `
    <div class="card q">
      <div class="q-top"><span class="dia">${i + 1}</span><div><div class="qar" lang="ar">${q}</div><div class="qru">${ru}</div></div></div>
      ${disc(id, 'Ответ')}
      <div class="ans" ${paneAttr(id)}>${mix(ans)}</div>
    </div>`; }).join('')}</div>`;
}

/* ---- exercises ---- */
function stTasks(L) {
  const B = BOOK[L.n];
  return `<div class="ltitle"><h2 class="h2 plain">Задания</h2><p class="note">Упражнения учебника (${a('تَمَارِينُ')}). Где можно, ответ проверяется сразу. В остальных нажмите на слово, чтобы открыть ответ.</p></div>
  ${B.tm.map((e, i) => exCard(L.n, i)).join('')}`;
}
function exCard(n, i) {
  const e = BOOK[n].tm[i], key = `${n}-${i}`;
  const body = { sort: sortBody, show: showBody, pick: pickBody, open: openBody }[e.t](key, e);
  return `<section class="card ex" id="ex-${key}">
    <div class="ex-h"><span class="dia">${i + 1}</span><div class="ru">${e.ru}</div></div>
    <div class="ex-ar" lang="ar">${e.ar}</div>
    ${e.text ? `<div class="ex-txt">${ar(e.text)}${e.tr ? `<span class="note">${e.tr}</span>` : ''}</div>` : ''}
    ${e.ex ? `<div class="ex-eg"><span class="lbl">Пример</span>${ar(e.ex)}</div>` : ''}
    ${e.words ? `<div class="ex-words" lang="ar">${e.words}</div>` : ''}
    ${body}
    ${e.note ? `<p class="note">${mix(e.note)}</p>` : ''}
  </section>`;
}
function exUpdate(key) {
  const [n, i] = key.split('-').map(Number), el = document.getElementById('ex-' + key);
  if (el) el.outerHTML = exCard(n, i);
}
function sortBody(key, e) {
  const st = TM[key] || (TM[key] = {});
  let ok = 0, n = 0;
  const rows = e.it.map(([w, ans, why], j) => {
    const p = st[j], want = [].concat(ans), right = want.includes(p);
    if (p !== undefined) { n++; if (right) ok++; }
    const chips = e.o.map((o, k) => {
      let c = ''; if (p !== undefined) { if (want.includes(k)) c = 'ok'; else if (k === p) c = 'bad'; }
      return `<button class="chip ${c}" data-act="so" data-k="${key}" data-j="${j}" data-v="${k}" ${p !== undefined ? 'disabled' : ''} lang="ar">${o}</button>`;
    }).join('');
    const fbk = p === undefined ? '' : `<div class="why ${right ? '' : 'bad'}"><b>${right ? 'Верно.' : 'Нет.'}</b> ${right ? '' : `Правильно: ${a(e.o[want[0]])}. `}${why ? mix(why) : ''}</div>`;
    return `<div class="srow">${ar(w)}<div class="chips ${e.wide ? 'wide' : ''}">${chips}</div>${fbk}</div>`;
  }).join('');
  const all = e.it.length;
  return `<div class="rows">${rows}</div><div class="score"><span>${n === all ? `Готово: <b>${ok} из ${all}</b> верно` : `Отвечено: <b>${n} из ${all}</b>`}</span>${n ? `<button class="linkbtn" data-act="so-reset" data-k="${key}">Заново</button>` : ''}</div>`;
}
function showBody(key, e) {
  const ids = e.it.map((_, j) => `sh${key}-${j}`), allOpen = ids.every(isOpen);
  const rows = e.it.map(([w, ans, ru, pf], j) => {
    const id = ids[j];
    const aHtml = ans ? (hasAr(ans) && !/[а-яё]/i.test(ans) ? `<div class="aa">${col(ans.replace(/→/g, '←'))}</div>` : `<div class="ar-ru">${mix(ans)}</div>`) : '';
    return `<div class="rvw"><button class="rv" data-act="tgl" data-t="${id}" aria-expanded="${isOpen(id)}"><span class="qm">?</span>${ar(w)}</button>
      <div class="rv-a" ${paneAttr(id)}>${aHtml}${ru ? `<div class="ru">${mix(ru)}</div>` : ''}${pf ? [].concat(pf).map(p => `<div class="pg">${p.h ? `<p class="pt-meta">${mix(p.h)}</p>` : ''}${grid(p.f, p.g)}</div>`).join('') : ''}</div></div>`;
  }).join('');
  return `<div class="rows">${rows}</div><div class="score"><span></span><button class="linkbtn" data-act="sh-all" data-k="${key}">${allOpen ? 'Скрыть ответы' : 'Показать все ответы'}</button></div>`;
}
function pickBody(key, e) {
  const st = TM[key] || (TM[key] = { sel: {}, chk: {} });
  return `<div class="rows">${e.it.map(([w, letters, add, why], j) => {
    const Ls = letters.split(' '), sel = st.sel[j] || [], chk = st.chk[j];
    let cls = Ls.map(() => ''), ok = false;
    if (chk) {
      const need = add.split(' ');
      cls = Ls.map((c, i) => { if (!sel.includes(i)) return ''; const k = need.indexOf(c); if (k >= 0) { need.splice(k, 1); return 'ok'; } return 'bad'; });
      const missing = need.slice();
      for (let i = Ls.length - 1; i >= 0 && missing.length; i--) { const k = missing.indexOf(Ls[i]); if (!sel.includes(i) && k >= 0) { cls[i] = 'miss'; missing.splice(k, 1); } }
      ok = cls.every(c => c !== 'bad' && c !== 'miss');
    } else cls = Ls.map((_, i) => sel.includes(i) ? 'sel' : '');
    const tiles = Ls.map((c, i) => `<button class="lt ${cls[i]}" data-act="pk" data-k="${key}" data-j="${j}" data-v="${i}" ${chk ? 'disabled' : ''} aria-pressed="${sel.includes(i)}">${c}</button>`).join('');
    return `<div class="lt-row"><div class="lts">${ar(w)}${tiles}</div>${chk ? `<div class="why ${ok ? '' : 'bad'}"><b>${ok ? 'Верно.' : 'Не совсем.'}</b> ${mix(why)}</div>` : `<button class="ck" data-act="pk-check" data-k="${key}" data-j="${j}" ${sel.length ? '' : 'disabled'}>Проверить</button>`}</div>`;
  }).join('')}</div><p class="note">Нажмите на добавочные буквы, затем «Проверить».</p>`;
}
const openBody = (key, e) => { const id = `op${key}`; return `${disc(id, 'Пример ответа')}<div class="sample" ${paneAttr(id)}>${e.sample}</div>`; };

/* ============ REFERENCE ============ */
const PRESETS = [['نصر', 'nasara', 'помогать'], ['ضرب', 'daraba', 'бить'], ['فتح', 'fataha', 'открывать'], ['سمع', 'samia', 'слышать'], ['حسب', 'hasiba', 'считать'], ['كرم', 'karuma', 'быть щедрым'], ['كتب', 'nasara', 'писать'], ['خرج', 'nasara', 'выходить'], ['جلس', 'daraba', 'сидеть'], ['ذهب', 'fataha', 'уходить'], ['علم', 'samia', 'знать']];
const CJ = { root: NSR.slice(), bab: 'nasara', t: 'm', pv: false, ru: 'помогать', err: '', input: '', custom: false };
const TENSES = [['m', 'Прошедшее'], ['u', 'Мудари‘'], ['n', 'С لَنْ'], ['j', 'С لَمْ'], ['a', 'Повеление']];
function vRef() {
  return `<h1 class="h1">Справочник</h1>
  <div class="seg">${[['conj', 'Спрягатель'], ['tables', 'Таблицы'], ['terms', 'Термины']].map(([v, n]) => `<button class="${REF === v ? 'on' : ''}" data-act="ref" data-v="${v}">${n}</button>`).join('')}</div>
  ${{ conj: vConj, tables: vTables, terms: vTerms }[REF]()}`;
}
function vConj() {
  const bab = babById(CJ.bab), pv = CJ.pv && CJ.t !== 'a';
  const part = CJ.t === 'n' ? 'لَنْ ' : CJ.t === 'j' ? 'لَمْ ' : '';
  const cell = k => (part ? `<span class="cj-part">${part}</span>` : '') + ar(form(CJ.root, bab, CJ.t, k, pv));
  return `
  <div class="card ctrl">
    <span class="lbl">Глагол</span>
    <div class="hscroll" dir="rtl">${PRESETS.map(([r, b, ru]) => { const on = !CJ.custom && CJ.root.join('') === r && CJ.bab === b; return `<button class="rchip ${on ? 'on' : ''}" data-act="cj-pre" data-r="${r}" data-b="${b}" data-ru="${ru}" lang="ar">${col(form([...r], babById(b), 'm', 0))}</button>`; }).join('')}<button class="rchip ru ${CJ.custom ? 'on' : ''}" data-act="cj-own">Свой корень</button></div>
    ${CJ.custom ? `<div class="inrow"><input id="rootin" type="text" lang="ar" placeholder="три буквы, например شكر" value="${CJ.input}" autocomplete="off"><button class="btn" data-act="cj-go">Спрягать</button></div>` : ''}
    ${CJ.err ? `<p class="err">${CJ.err}</p>` : ''}
    <span class="lbl">Баб</span>
    <div class="hscroll" dir="rtl">${BABS.map(b => `<button class="rchip ${CJ.bab === b.id ? 'on' : ''}" data-act="cj-bab" data-v="${b.id}" lang="ar">${col(form(MZ, b, 'm', 0) + ' – ' + form(MZ, b, 'u', 0))}</button>`).join('')}</div>
    <span class="lbl">Форма</span>
    <div class="hscroll">${TENSES.map(([v, n]) => `<button class="rchip ru ${CJ.t === v ? 'on' : ''}" data-act="cj-t" data-v="${v}">${n.replace(/(لَنْ|لَمْ)/, m => a(m))}</button>`).join('')}</div>
    ${CJ.t !== 'a' ? `<div class="seg"><button class="${!CJ.pv ? 'on' : ''}" data-act="cj-pv" data-v="0">Действительный</button><button class="${CJ.pv ? 'on' : ''}" data-act="cj-pv" data-v="1">Страдательный</button></div>` : ''}
  </div>
  <div class="cj-hero">
    <div class="cj-big">${ar(form(CJ.root, bab, 'm', 0, pv))}<span class="dash">–</span>${ar(form(CJ.root, bab, 'u', 0, pv))}</div>
    <div class="cj-meta">${CJ.ru ? CJ.ru + ' · ' : ''}${pv ? 'страдательный залог' : 'действительный залог'}</div>
  </div>
  ${paradigmCells(cell, GROUPS)}
  <p class="note">${CJ.t === 'a' ? 'У 2-го лица особая форма повеления (урок 9). Для 1-го и 3-го лица — лям повеления + джазм: لِيَنْصُرْ «пусть поможет», لِأَنْصُرْ «дай-ка я помогу» (урок 8).' : CJ.t === 'n' ? 'Насб: дамма → фатха, нуны выпадают, кроме ж. мн. (урок 8).' : CJ.t === 'j' ? 'Джазм: дамма → сукун, нуны выпадают, кроме ж. мн. (урок 8).' : pv ? 'Страдательный залог обычно образуют от переходных глаголов (уроки 4, 5, 7).' : 'Баб глагола узнают по словарю (урок 2).'} Спрягатель пока работает только со «здравыми» трёхбуквенными корнями.</p>`;
}
function paradigmCells(cellFn, groups) {
  const cells = (row, last) => row.map((k, j) => `<div class="cell ${last && j === 1 ? 'span2' : ''}"><span class="w" dir="rtl">${cellFn(k)}</span><small>${ar(PRON[k][0])} · ${PRON[k][1]}</small></div>`).join('');
  return `<div class="cols"><span><b>مُفْرَدٌ</b><bdi dir="ltr">ед. ч.</bdi></span><span><b>مُثَنًّى</b><bdi dir="ltr">дв. ч.</bdi></span><span><b>جَمْعٌ</b><bdi dir="ltr">мн. ч.</bdi></span></div>
  ${groups.map(g => `<div class="cg-h">${ar(g.h)}<small>${g.ru}</small></div>${g.rows.map(r => `<div class="cgrid">${cells(r, r.length === 2)}</div>`).join('')}`).join('')}`;
}
function vTables() {
  return `
  <h2 class="h2">Шесть бабов</h2><div class="card">${tblBabs()}</div>
  <h2 class="h2">Бабы с добавками</h2><div class="card">${tblMazid()}</div>
  <h2 class="h2">Значения бабов</h2><div class="card">${MEAN_MUJ()}</div><div class="card">${MEAN_MAZ()}</div>
  <h2 class="h2">Частицы насба и джазма</h2><div class="card">${tblParticles()}</div>
  <h2 class="h2">Нун усиления</h2><div class="card">${BOOK[11].tb[0].html()}</div>
  <h2 class="h2">Мизан</h2><div class="card">${tblMizan()}</div>`;
}
function vTerms() {
  return `<p class="note">Слова, которые учебник просит запомнить (урок 1).</p>
  ${GLOSS.map(([h, l]) => `<h2 class="h2">${h}</h2><div class="card">${glossTbl(l)}</div>`).join('')}`;
}
function cjCustom() {
  const raw = ($('#rootin') || {}).value || '';
  CJ.input = raw;
  const letters = [...raw.replace(/[ً-ٰٟـ\s\-–·,.]/g, '')];
  if (!letters.length) { CJ.err = 'Введите три буквы корня, например شكر.'; return rerender(); }
  if (letters.some(ch => !/[ء-ي]/.test(ch))) { CJ.err = 'Нужны арабские буквы.'; return rerender(); }
  if (letters.length !== 3) { CJ.err = `В корне ${letters.length} ${plural(letters.length, ['буква', 'буквы', 'букв'])}, а спрягатель пока работает с трёхбуквенными.`; return rerender(); }
  if (letters.some(ch => /[اويىءأإآؤئ]/.test(ch))) { CJ.err = 'В корне есть слабая буква или хамза. Такие глаголы добавим вместе с уроками о них.'; return rerender(); }
  if (letters[1] === letters[2]) { CJ.err = 'Удвоенные корни (как مدّ) спрягаются по особым правилам. Добавим позже.'; return rerender(); }
  CJ.root = letters; CJ.ru = ''; CJ.err = '';
  rerender();
}

/* ============ SHEETS ============ */
function openSheet(html) { const sh = $('#sheet'); sh.innerHTML = '<div class="grab"></div>' + html; sh.hidden = false; $('#scrim').hidden = false; const f = sh.querySelector('button,input'); if (f) f.focus({ preventScroll: true }); hSync(); }
function closeSheet() { $('#sheet').hidden = true; $('#scrim').hidden = true; hSync(); }
function sheetOpenWord(el) { openSheet(wordSheet(el.textContent) + '<button class="btn ghost block" data-act="close">Понятно</button>'); }
/* ============ история: системная кнопка «Назад» закрывает шторку и возвращает к списку уроков ============ */
const hWant = () => (R !== 'home' ? 1 : 0) + (sheetOpen() ? 1 : 0);
const hHave = () => (history.state && history.state.mz) || 0;
let hTimer = 0;
function hSync() {
  clearTimeout(hTimer);
  hTimer = setTimeout(() => {
    try {
      let have = hHave(); const want = hWant();
      while (have < want) history.pushState({ mz: ++have }, '');
      if (have > want) history.go(want - have);
    } catch (e) {}
  }, 0);
}
window.addEventListener('popstate', e => {
  const have = (e.state && e.state.mz) || 0;
  if (hWant() > have && sheetOpen()) { $('#sheet').hidden = true; $('#scrim').hidden = true; }
  if (hWant() > have && R !== 'home') { R = 'home'; render(); window.scrollTo(0, 0); }
});

const sheetOpen = () => !$('#sheet').hidden;
function settingsHtml() {
  return `<h3>Настройки</h3>
  <span class="lbl">Тема</span>
  <div class="seg">${[['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(([v, n]) => `<button class="${S.theme === v ? 'on' : ''}" data-act="theme" data-v="${v}">${n}</button>`).join('')}</div>
  <label class="lbl" for="arsize">Размер арабского текста</label>
  <div class="arsize"><span class="ar" style="font-size:16px">ب</span><input type="range" id="arsize" min="0.85" max="1.4" step="0.05" value="${S.ar}"><span class="ar" style="font-size:28px">ب</span></div>
  <p class="ar sample-ar" lang="ar">اِعْلَمْ أَنَّ التَّصْرِيفَ فِي اللُّغَةِ التَّغْيِيرُ</p>
  <button class="btn ghost block" data-act="close">Готово</button>`;
}
function openTerm(k) {
  const [t, ru, d] = TERMS[k];
  openSheet(`<div class="term-sh"><span class="lbl">Термин</span><div class="ar" lang="ar">${t}</div><div class="ru">${ru}</div><p>${mix(d)}</p></div><button class="btn ghost block" data-act="close">Понятно</button>`);
}

/* ============ ACTIONS ============ */
const ACT = {
  settings: () => openSheet(settingsHtml()),
  close: closeSheet,
  theme: el => { S.theme = el.dataset.v; persist(); applyLook(); $('#sheet').innerHTML = '<div class="grab"></div>' + settingsHtml(); },
  step: el => { const v = +el.dataset.v; S.at[CUR] = v; S.max[CUR] = Math.max(S.max[CUR] || 0, v); persist(); render(); window.scrollTo(0, 0); },
  tgl: el => {
    const id = el.dataset.t, p = document.getElementById(id); if (!p) return;
    p.hidden = !p.hidden; p.hidden ? OPEN.delete(id) : OPEN.add(id);
    el.setAttribute('aria-expanded', String(!p.hidden));
    const ex = el.closest('.ex'); if (ex && el.classList.contains('rv')) { const b = ex.querySelector('[data-act="sh-all"]'); if (b) b.textContent = [...ex.querySelectorAll('.rv')].every(x => x.getAttribute('aria-expanded') === 'true') ? 'Скрыть ответы' : 'Показать все ответы'; }
  },
  'wk-tab': el => { W.i = +el.dataset.v; W.step = 1; W.pick = {}; wkRender(); },
  'wk-next': () => { W.step++; wkRender(); },
  'wk-opt': el => { W.pick[+el.dataset.k] = +el.dataset.j; wkRender(); },
  pt: el => { PT[el.dataset.k] = +el.dataset.v; const fb = el.closest('.fold-b'); if (fb) { const [n, i] = el.dataset.k.split('-').map(Number), t = BOOK[n].tb[i]; fb.innerHTML = ptab(el.dataset.k, t.pt) + (t.note ? `<p class="note">${mix(t.note)}</p>` : ''); } },
  so: el => { const k = el.dataset.k; TM[k][+el.dataset.j] = +el.dataset.v; exUpdate(k); },
  'so-reset': el => { TM[el.dataset.k] = {}; exUpdate(el.dataset.k); },
  'sh-all': el => {
    const k = el.dataset.k, [n, i] = k.split('-').map(Number), ids = BOOK[n].tm[i].it.map((_, j) => `sh${k}-${j}`);
    const all = ids.every(isOpen); ids.forEach(id => all ? OPEN.delete(id) : OPEN.add(id)); exUpdate(k);
  },
  pk: el => { const st = TM[el.dataset.k], j = +el.dataset.j, v = +el.dataset.v, s = st.sel[j] || (st.sel[j] = []); const x = s.indexOf(v); x < 0 ? s.push(v) : s.splice(x, 1); exUpdate(el.dataset.k); },
  'pk-check': el => { TM[el.dataset.k].chk[+el.dataset.j] = true; exUpdate(el.dataset.k); },
  finish: () => { S.done[CUR] = 1; S.max[CUR] = NS - 1; const nx = lessonBy(CUR + 1); if (nx) S.last = nx.n; persist(); go('home'); },
  ref: el => { REF = el.dataset.v; rerender(); },
  'open-conj': el => { CJ.t = el.dataset.t; CJ.pv = false; REF = 'conj'; go('ref'); },
  'cj-pre': el => { CJ.root = [...el.dataset.r]; CJ.bab = el.dataset.b; CJ.ru = el.dataset.ru; CJ.err = ''; CJ.input = ''; CJ.custom = false; rerender(); },
  'cj-own': () => { CJ.custom = true; CJ.err = ''; rerender(); const i = $('#rootin'); if (i) i.focus({ preventScroll: true }); },
  'cj-bab': el => { CJ.bab = el.dataset.v; rerender(); },
  'cj-t': el => { CJ.t = el.dataset.v; rerender(); },
  'cj-pv': el => { CJ.pv = el.dataset.v === '1'; rerender(); },
  'cj-go': cjCustom,
};

document.addEventListener('click', e => {
  if (e.target.id === 'scrim') return closeSheet();
  const ls = e.target.closest('[data-lesson]'); if (ls) { closeSheet(); return openLesson(+ls.dataset.lesson); }
  const g = e.target.closest('[data-go]'); if (g) { closeSheet(); return go(g.dataset.go); }
  const t = e.target.closest('[data-term]'); if (t) return openTerm(t.dataset.term);
  const tword = e.target.closest('.tw'); if (tword) return sheetOpenWord(tword);
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'rootin') cjCustom();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('term')) { e.preventDefault(); openTerm(e.target.dataset.term); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tw')) { e.preventDefault(); sheetOpenWord(e.target); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'arsize') { S.ar = +e.target.value; applyLook(); persist(); }
  if (e.target.id === 'rootin') CJ.input = e.target.value;
});
window.addEventListener('resize', () => document.documentElement.style.setProperty('--top-h', $('#top').offsetHeight + 'px'));

applyLook();
render();

/* ============ ТЕРМИНЫ АРАБСКИМ ПИСЬМОМ ============
   В русском тексте термины не пишем кириллицей: «мудари‘» → مُضَارِع и т. д.
   Работает на готовом DOM: всё, что попало на страницу, проходит через arTerms. */
const RU = '[А-Яа-яЁё]';
const TERM_RX = [
  [/(Четыре|четыре) буквы мудари‘/g, 'حُرُوفُ الْمُضَارَعَةِ الْأَرْبَعَةُ'],
  [/[Бб]укв(?:а|ы|у|ой|е)? мудари‘/g, 'حَرْفُ الْمُضَارَعَةِ'],
  [/[Хх]амз(?:а|ы|у|ой|е) васль/g, 'هَمْزَةُ الْوَصْلِ'],
  [/[Хх]амз(?:а|ы|у|ой|е) катъ/g, 'هَمْزَةُ الْقَطْعِ'],
  [/[Лл]ям(?:а|у|ом|е)? повеления/g, 'لَامُ الْأَمْرِ'],
  [/[Нн]ун(?:ы|ов|ам|ами|ах) усиления/g, 'نُونَا التَّوْكِيدِ'],
  [/[Нн]ун(?:а|у|ом|е)? усиления/g, 'نُونُ التَّوْكِيدِ'],
  [/[Мм]удари‘/g, 'مُضَارِع'],
  [/[Бб]аб(?:ы|ов|ам|ами|ах)/g, 'أَبْوَاب'],
  [/[Бб]аб(?:а|у|ом|е)?/g, 'بَاب'],
  [/[Мм]асдар(?:ы|ов|ам|ами|ах)/g, 'مَصَادِر'],
  [/[Мм]асдар(?:а|у|ом|е)?/g, 'مَصْدَر'],
  [/[Дд]жазим/g, 'جَازِم'],
  [/[Дд]жазм(?:а|у|ом|е)?/g, 'جَزْم'],
  [/[Нн]асиб/g, 'نَاصِب'],
  [/[Нн]асб(?:а|у|ом|е)?/g, 'نَصْب'],
  [/[Тт]асриф(?:а|у|ом|е)?/g, 'التَّصْرِيف'],
  [/[Сс]арф(?:а|у|ом|е)?/g, 'الصَّرْف'],
  [/[Нн]ахв(?:а|у|ом|е)?/g, 'النَّحْو'],
  [/фа‘иль/g, 'فَعِيل'],
].map(([rx, w]) => [new RegExp(`(?<!${RU})(?:${rx.source})(?!${RU})`, 'g'), w]);
const TERM_ANY = new RegExp(TERM_RX.map(([rx]) => rx.source).join('|'));

function arTerms(root) {
  if (!root || root.nodeType !== 1 && root.nodeType !== 3) return;
  const nodes = [];
  if (root.nodeType === 3) { if (TERM_ANY.test(root.nodeValue)) nodes.push(root); }
  else {
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => n.parentElement && !n.parentElement.closest('[lang="ar"], script, style, textarea, input, .brand')
        && TERM_ANY.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
    });
    while (tw.nextNode()) nodes.push(tw.currentNode);
  }
  for (const n of nodes) {
    if (n.parentElement && n.parentElement.closest('[lang="ar"], .brand')) continue;
    let html = n.nodeValue.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    for (const [rx, w] of TERM_RX) html = html.replace(rx, `\u0000${w}\u0001`);
    if (!html.includes('\u0000')) continue;
    html = html.replace(/\u0000([^\u0001]*)\u0001/g, (_, w) => a(w));
    const t = document.createElement('template');
    t.innerHTML = html;
    // во flex/grid-контейнере текст и вставленный термин стали бы отдельными колонками — держим их одним куском
    const pd = n.parentElement && getComputedStyle(n.parentElement).display;
    if (/flex|grid/.test(pd || '')) { const sp = document.createElement('span'); sp.append(t.content); n.replaceWith(sp); }
    else n.replaceWith(t.content);
  }
}
arTerms(document.body);
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(arTerms))).observe(document.body, { childList: true, subtree: true });
</script>
